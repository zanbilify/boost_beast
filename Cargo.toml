[package]
name = "boost_beast"
description = "Boost C++ library boost_beast packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_beast"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_beast"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_asio = { version = "0.1.0", path = "../boost_asio" }
boost_assert = { version = "0.1.0", path = "../boost_assert" }
boost_bind = { version = "0.1.0", path = "../boost_bind" }
boost_config = { version = "0.1.0", path = "../boost_config" }
boost_container = { version = "0.1.0", path = "../boost_container" }
boost_container_hash = { version = "0.1.0", path = "../boost_container_hash" }
boost_core = { version = "0.1.0", path = "../boost_core" }
boost_endian = { version = "0.1.0", path = "../boost_endian" }
boost_intrusive = { version = "0.1.0", path = "../boost_intrusive" }
boost_logic = { version = "0.1.0", path = "../boost_logic" }
boost_mp11 = { version = "0.1.0", path = "../boost_mp11" }
boost_optional = { version = "0.1.0", path = "../boost_optional" }
boost_preprocessor = { version = "0.1.0", path = "../boost_preprocessor" }
boost_smart_ptr = { version = "0.1.0", path = "../boost_smart_ptr" }
boost_static_assert = { version = "0.1.0", path = "../boost_static_assert" }
boost_static_string = { version = "0.1.0", path = "../boost_static_string" }
boost_system = { version = "0.1.0", path = "../boost_system" }
boost_throw_exception = { version = "0.1.0", path = "../boost_throw_exception" }
boost_type_index = { version = "0.1.0", path = "../boost_type_index" }
boost_type_traits = { version = "0.1.0", path = "../boost_type_traits" }
boost_winapi = { version = "0.1.0", path = "../boost_winapi" }

[build-dependencies]
zanbil-boost-build = "0.1.0"
